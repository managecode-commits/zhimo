name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v6
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y gir1.2-ibus-1.0 python3-gi
      - run: ./tools/verify.sh
      - run: python3 tools/test-release-contract.py
      - run: python3 -m py_compile platform/linux-ibus/zhimo_ibus.py
      - run: python3 platform/linux-ibus/runtime_smoke.py
      - run: python3 -B platform/linux-ibus/test_keyboard.py
      - run: bash -n platform/linux-ibus/*.sh tools/*.sh

  portable-core:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: cargo test -p ime-core -p ime-engine-latin -p ime-engine-pinyin -p ime-engine-router -p ime-engine-vietnamese -p ime-speech

  windows-tsf:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Verify installer parsing and mocked registration
        shell: powershell
        run: ./tools/test-windows-dual-scripts.ps1
      - run: cargo build -p ime-ffi
      - run: cmake -S platform/windows-tsf -B target/windows-tsf -A x64
      - run: cmake --build target/windows-tsf --config Debug
      - run: ./target/windows-tsf/Debug/zhimo-tsf-probe.exe

  shared-speech:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/prepare-offline-speech.sh
      - run: cmake -S platform/shared-speech -B target/shared-speech -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build target/shared-speech --parallel 2
      - run: ctest --test-dir target/shared-speech --output-on-failure

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit

  linux-fcitx5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - run: sudo apt-get update && sudo apt-get install -y libfcitx5core-dev cmake ninja-build
      - run: cargo build -p ime-ffi
      - run: >-
          cmake -S platform/linux-fcitx5 -B target/fcitx5 -G Ninja
          -DZHIMO_IME_LIBRARY=${{ github.workspace }}/target/debug/libime_ffi.so
      - run: cmake --build target/fcitx5
