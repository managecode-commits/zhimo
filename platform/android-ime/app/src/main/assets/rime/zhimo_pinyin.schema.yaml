schema:
  schema_id: zhimo_pinyin
  name: Zhimo 简体拼音
  version: "1.2"
  author:
    - Zhimo Contributors
  description: Zhimo 全拼方案，使用离线简体拼音词典并启用本地用户词典

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, ABC]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra:
    # Syllabic m/n entries otherwise shadow mixed abbreviations such as nhao.
    # 嗯 remains available through its ordinary en reading.
    - erase/^[mn]$/
    - abbrev/^([a-z]).+$/$1/
    - abbrev/^([zcs]h).+$/$1/

translator:
  dictionary: zhimo_pinyin
  spelling_hints: 32
  always_show_comments: true
  enable_user_dict: true
  enable_sentence: true
  enable_completion: true

punctuator:
  half_shape:
    ',': '，'
    '.': '。'
    '?': '？'
    '!': '！'

key_binder:
  bindings:
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }

recognizer:
  patterns:
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
