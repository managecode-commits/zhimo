schema:
  schema_id: zhimo_beta
  name: Zhimo Beta 拼音
  version: "1.0"
  author:
    - Zhimo Contributors
  description: Zhimo Android Beta 自有最小验证词库

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, ABC]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"

translator:
  dictionary: zhimo_beta
  enable_user_dict: true
  enable_sentence: true

punctuator:
  half_shape:
    ',': '，'
    '.': '。'
    '?': '？'
    '!': '！'

key_binder:
  bindings:
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }

recognizer:
  patterns:
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
